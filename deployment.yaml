apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron
  namespace: homefinder
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          volumes:
          - name: cache
            hostPath:
              path: /opt/homefinder
          containers:
          - name: cron
            image: ghcr.io/byrnedo/homefinder@sha256:926ffe2c7e5b3915a7597391409e0c80913c37b98079c5681a4d0ad0a1d21e9c
            imagePullPolicy: Always
            volumeMounts:
            - mountPath: /cache
              name: cache
            env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: config
                  key: slack_webhook_url
            - name: CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: config
                  key: credentials
            - name: SPREADSHEET_ID
              valueFrom:
                secretKeyRef:
                  name: config
                  key: spreadsheet_id

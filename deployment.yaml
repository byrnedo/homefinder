apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron
  namespace: homefinder
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          volumes:
          - name: cache
            hostPath:
              path: /opt/homefinder
          containers:
          - name: cron
            image: ghcr.io/byrnedo/homefinder@sha256:94fecc9d12b3a7e8a7c76730f2ffc24561211eb585c21ca6b7e5751b04bc2c62
            imagePullPolicy: Always
            volumeMounts:
            - mountPath: /cache
              name: cache
            env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: config
                  key: slack_webhook_url
            - name: CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: config
                  key: credentials
            - name: SPREADSHEET_ID
              valueFrom:
                secretKeyRef:
                  name: config
                  key: spreadsheet_id
